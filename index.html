<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facility Management - Lazuardi GCS</title>
    <meta name="description" content="Aplikasi Work Order Mobile OB/OG Unit Facility Management Lazuardi GCS dengan integrasi Google Sheets 2 arah dan Google Drive." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var _rawFetch = window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _rawFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch || _rawFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If window.fetch cannot be reconfigured directly, catch silently
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-sky-500 selection:text-white" style="font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
